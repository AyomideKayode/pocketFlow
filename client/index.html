    <meta charset="UTF-8" />
    <script>
      (function () {
        const t = localStorage.getItem('pocketflow-theme');
        document.documentElement.classList.add(
          t === 'light' || t === 'dark' ? t : 'dark',
        );
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="PocketFlow — Simple Personal Finance Tracker. Track expenses, monitor bills, and understand your spending — all in one calm, secure place."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <title>PocketFlow - Personal Finance Tracker</title>
